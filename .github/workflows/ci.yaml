name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o dist/freepbx-exporter-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/freepbx-exporter
      - uses: actions/upload-artifact@v4
        with:
          name: freepbx-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/freepbx-exporter-${{ matrix.goos }}-${{ matrix.goarch }}

  package:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            pkgarch: amd64
          - goarch: arm64
            pkgarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: freepbx-exporter-linux-${{ matrix.goarch }}
          path: .
      - name: Stage binary
        run: |
          mv freepbx-exporter-linux-${{ matrix.goarch }} freepbx-exporter
          chmod +x freepbx-exporter
      - name: Install nfpm
        run: |
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v2.38.0/nfpm_2.38.0_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
      - name: Build .deb
        env:
          VERSION: ${{ github.ref_name }}
          PKG_ARCH: ${{ matrix.pkgarch }}
        run: |
          mkdir -p dist
          # Strip leading 'v' from tag so debs follow x.y.z convention.
          VERSION="${VERSION#v}"
          export VERSION
          nfpm pkg --packager deb \
            --target "dist/freepbx-exporter_${VERSION}_${PKG_ARCH}.deb" \
            -f nfpm.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.pkgarch }}
          path: dist/*.deb

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/freepbx-exporter-linux-amd64/freepbx-exporter-linux-amd64
            artifacts/freepbx-exporter-linux-arm64/freepbx-exporter-linux-arm64
            artifacts/deb-amd64/*.deb
            artifacts/deb-arm64/*.deb
          generate_release_notes: true
